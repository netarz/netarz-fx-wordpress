name: گزارش اشکال (Bug report)
description: کدی در این مخزن کار نمی‌کند یا نتیجهٔ نادرست می‌دهد.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ممنون که گزارش می‌دهید. مشکل حساب، اعتبار یا پرداخت را این‌جا ننویسید؛ از پنل نِت اَرز تیکت بزنید.
        مشکل امنیتی را هم فقط به dev@netarz.ir بفرستید.
  - type: input
    id: where
    attributes:
      label: نسخهٔ افزونه (Plugin version)
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: چه اتفاقی افتاد؟ (What happened?)
      description: متن کامل خطا یا پاسخ API را بگذارید. کلید را از آن پاک کنید.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: انتظار چه چیزی را داشتید؟ (What did you expect?)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: مراحل بازتولید (Steps to reproduce)
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: environment
    attributes:
      label: محیط اجرا (Environment)
      description: نسخهٔ وردپرس و PHP، قالب، و حالت اتصال (از همین سرور یا از مرورگر).
      placeholder: WordPress 6.8, PHP 8.1, Astra, server mode
    validations:
      required: true
  - type: textarea
    id: test_connection
    attributes:
      label: نتیجهٔ «آزمایش اتصال» (Test connection)
      description: در «تنظیمات ← نرخ ارز نِت اَرز» (Settings ← NetArz FX) دکمهٔ «آزمایش اتصال» را بزنید و پیامش را این‌جا بگذارید.
  - type: checkboxes
    id: no_secrets
    attributes:
      label: پیش از ارسال
      options:
        - label: کلید واقعی، توکن و اطلاعات شخصی را از متن حذف کرده‌ام. (I removed real keys and personal data.)
          required: true
